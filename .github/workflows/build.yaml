name: Build and Publish Cassandra Exporter

on:
  release:
    types: [created]
  push:
    branches:
      - '**'

env:
  TAG_NAME: ${{ github.event.release.tag_name || github.ref }}
  PUSH: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_docker) && github.actor != 'dependabot[bot]' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set Up Maven
        run: |
          echo "MAVEN_OPTS='-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true'" >> $GITHUB_ENV

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-exporter
          path: agent/target/cassandra-exporter-agent*.jar
